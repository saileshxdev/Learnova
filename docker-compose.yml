services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learnova-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnova
    ports:
      - "5432:5432"
    volumes:
      - learnova-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  learnova-pgdata:
